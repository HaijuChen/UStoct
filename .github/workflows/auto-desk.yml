# Paper desk only. This file is not triggered by push, so the state commit
# cannot start another run. [skip ci] is a second guard. The job also commits
# data/state.json and nothing else.
#
# Schedule is UTC, Monday–Friday, and does not move with US daylight saving:
#   15:30 UTC  台北 23:30  開盤後（美東約開盤後 1 小時；夏令約 2 小時）
#   19:30 UTC  台北 03:30  收盤前（次日）
#   21:15 UTC  台北 05:15  收盤後（次日）
#
# If the push fails with 403 / "Write access to repository not granted":
# GitHub repo → Settings → Actions → General → Workflow permissions
# → select "Read and write permissions" → Save.
# 若出現 403：到此 repo 的 Settings → Actions → General → Workflow permissions，
# 改選 Read and write permissions 後存檔。若 main 有分支保護，需允許
# github-actions[bot] 推送到 main。

name: 自動模擬交易

on:
  schedule:
    - cron: '30 15 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ustoct-auto-desk
  cancel-in-progress: false

jobs:
  paper:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run paper engine
        run: node scripts/auto.mjs

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          if git diff --cached --name-only | grep -vx 'data/state.json'; then
            echo "refusing to commit anything except data/state.json"
            exit 1
          fi
          git commit -m "chore: update paper trading state [skip ci]"
          git push origin HEAD:main
